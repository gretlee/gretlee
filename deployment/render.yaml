# Render.com Blueprint for Backend Deployment
# This file configures automatic deployment of the Flask API

services:
  # Backend API Service
  - type: web
    name: urban-sustainability-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 backend.app:app"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: 1
    
    # Automatic deployment
    autoDeploy: true
    
    # Disk storage for model files (optional)
    disk:
      name: model-storage
      mountPath: /app/ml_models/saved_models
      sizeGB: 1

