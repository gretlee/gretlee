version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: sustainability-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ../data:/app/data
      - ../ml_models/saved_models:/app/ml_models/saved_models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (optional - for full-stack deployment)
  # Uncomment if you want to run frontend in Docker as well
  # frontend:
  #   image: node:18-alpine
  #   container_name: sustainability-frontend
  #   working_dir: /app
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - ../frontend:/app
  #   command: sh -c "npm install && npm start"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:5000/api
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

networks:
  default:
    name: sustainability-network
